name: Unit Tests & Quality Gates

on:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

# Prevent duplicate runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt ruff

      - name: Run ruff check
        id: ruff
        run: |
          ruff check . 2>&1 | tee ruff-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run unit tests with coverage
        id: run_tests
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            --junitxml=test-results.xml \
            -v 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          pct = data['totals']['percent_covered_display']
          print(pct)
          ")
          echo "percentage=${COVERAGE}" >> "$GITHUB_OUTPUT"

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          comment_title: "🧪 Unit Test Results"
          check_name: "Unit Test Results"
          fail_on: "test failures"

      - name: Post coverage & quality gate summary as PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.readFileSync('test-output.txt', 'utf8');
            const ruffOutput = fs.existsSync('ruff-output.txt') ? fs.readFileSync('ruff-output.txt', 'utf8') : '';
            const coveragePct = '${{ steps.coverage.outputs.percentage }}';
            const testExitCode = '${{ steps.run_tests.outputs.exit_code }}';
            const ruffExitCode = '${{ steps.ruff.outputs.exit_code }}';

            // Extract coverage table section
            const lines = testOutput.split('\n');
            const coverageStart = lines.findIndex(l => l.includes('coverage: platform'));
            const coverageSection = coverageStart >= 0
              ? lines.slice(coverageStart, coverageStart + 20).join('\n')
              : 'Coverage report not available.';

            // Last 60 lines of test output for full review
            const fullOutput = lines.slice(-60).join('\n');

            const testStatus  = testExitCode === '0'      ? '✅ Passed' : '❌ Failed';
            const covStatus   = parseInt(coveragePct) >= 80 ? '✅ Passed' : '❌ Failed';
            const ruffStatus  = ruffExitCode === '0'       ? '✅ Passed' : '❌ Failed';

            const ruffSection = ruffExitCode !== '0' && ruffOutput.trim()
              ? [
                  '<details>',
                  `<summary><b>🔍 Ruff Output</b></summary>`,
                  '',
                  '```',
                  ruffOutput.trim(),
                  '```',
                  '</details>',
                  '',
                ].join('\n')
              : '';

            const body = [
              '## 🧪 Test & Quality Gate Report',
              '',
              '<details>',
              `<summary><b>📊 Coverage Summary — ${coveragePct}%</b> (minimum required: 80%)</summary>`,
              '',
              '```',
              coverageSection,
              '```',
              '</details>',
              '',
              '<details>',
              '<summary><b>📋 Full Test Output</b></summary>',
              '',
              '```',
              fullOutput,
              '```',
              '</details>',
              '',
              ruffSection,
              '---',
              '**Quality Gates:**',
              '| Gate | Threshold | Status |',
              '|------|-----------|--------|',
              `| Unit Tests | All pass | ${testStatus} |`,
              `| Code Coverage | ≥ 80% | ${covStatus} |`,
              `| Ruff Lint | No errors | ${ruffStatus} |`,
              '',
              `> _Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const marker = '## 🧪 Test & Quality Gate Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            coverage.json
            test-output.txt
            ruff-output.txt
          retention-days: 30

      - name: Enforce quality gate — fail if tests failed or coverage below 80%
        if: steps.run_tests.outputs.exit_code != '0'
        run: |
          echo "❌ Quality gate failed: unit tests or coverage threshold not met."
          echo "Review the test output and coverage report above."
          exit 1
