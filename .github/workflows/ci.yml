name: Unit Tests & Quality Gates

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests with coverage
        id: run_tests
        run: |
          set +e
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=80 \
            --junitxml=test-results.xml \
            -v 2>&1 | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Extract coverage percentage
        id: coverage
        if: always()
        run: |
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          else
            COVERAGE=0
          fi
          echo "percentage=${COVERAGE}" >> "$GITHUB_OUTPUT"

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('test-results.xml') != ''
        with:
          files: test-results.xml
          comment_mode: off
          check_name: "Unit Test Results"
          fail_on: "test failures"

      - name: Post coverage summary as PR comment
        uses: actions/github-script@v7
        if: always()
        env:
          COVERAGE_PCT: ${{ steps.coverage.outputs.percentage }}
          TEST_EXIT_CODE: ${{ steps.run_tests.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('test-output.txt')
              ? fs.readFileSync('test-output.txt', 'utf8')
              : 'Test output not available.';

            const coveragePct = process.env.COVERAGE_PCT || '0';
            const testExitCode = process.env.TEST_EXIT_CODE || '1';

            const lines = testOutput.split('\n');
            const coverageStart = lines.findIndex(l => l.includes('coverage: platform'));
            const coverageSection = coverageStart >= 0
              ? lines.slice(coverageStart, coverageStart + 20).join('\n')
              : 'Coverage report not available.';

            const fullOutput = lines.slice(-60).join('\n');

            const testStatus = testExitCode === '0' ? '✅ Passed' : '❌ Failed';
            const covStatus = parseFloat(coveragePct) >= 80 ? '✅ Passed' : '❌ Failed';

            const body = [
              '## 🧪 Test & Quality Gate Report',
              '',
              '<details>',
              `<summary><b>📊 Coverage Summary — ${coveragePct}%</b> (minimum required: 80%)</summary>`,
              '',
              '```',
              coverageSection,
              '```',
              '</details>',
              '',
              '<details>',
              '<summary><b>📋 Full Test Output</b></summary>',
              '',
              '```',
              fullOutput,
              '```',
              '</details>',
              '',
              '---',
              '**Quality Gates:**',
              '| Gate | Threshold | Status |',
              '|------|-----------|--------|',
              `| Unit Tests | All pass | ${testStatus} |`,
              `| Code Coverage | ≥ 80% | ${covStatus} |`,
              '',
              `> _Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const marker = '## 🧪 Test & Quality Gate Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce quality gate
        if: steps.run_tests.outputs.exit_code != '0'
        run: |
          echo "❌ Quality gate failed: unit tests or coverage threshold not met."
          echo "Review the test output and coverage report above."
          exit 1

  cicd:
    name: Fake CI/CD
    needs: [test]
    if: always() && (github.event_name == 'push' || needs.test.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Fake CI/CD execution
        run: |
          echo "Running fake CI/CD..."
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "This simulates the Iberdrola reusable workflow."

      - name: Fake deploy/packaging step
        run: |
          echo "Building artifact..."
          echo "Packaging application..."
          echo "CI/CD finished successfully."
